[project]
name = "routeiq-simulator"
version = "0.1.0"
description = "RouteIQ fleet simulator — virtual agents & incident generation"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0,<0.29",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
