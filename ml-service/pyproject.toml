[project]
name = "routeiq-ml-service"
version = "0.1.0"
description = "RouteIQ ML Service — LSTM, Prophet, Isolation Forest"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0,<1.0",
    "uvicorn>=0.34.0,<1.0",
    "pydantic>=2.12.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "redis>=5.3.0,<6.0",
    "torch>=2.6.0,<3.0",
    "scikit-learn>=1.6.0,<2.0",
    "prophet>=1.1.0,<2.0",
    "numpy>=2.2.0,<3.0",
    "pandas>=2.2.0,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
