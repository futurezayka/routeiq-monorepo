[project]
name = "routeiq-backend"
version = "0.1.0"
description = "RouteIQ — intelligent real-time vehicle tracking platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0,<0.137",
    "uvicorn[standard]>=0.34.0,<0.35",
    "pydantic>=2.12.0,<3",
    "pydantic-settings>=2.8.0,<3",
    "sqlalchemy[asyncio]>=2.0.49,<2.1",
    "asyncpg>=0.31.0,<0.32",
    "alembic>=1.15.0,<1.16",
    "geoalchemy2>=0.17.0,<0.18",
    "shapely>=2.0.0,<3",
    "redis>=5.3.0,<6",
    "httpx>=0.28.0,<0.29",
    "python-jose[cryptography]>=3.4.0,<4",
    "passlib[bcrypt]>=1.7.4,<2",
    "python-multipart>=0.0.20",
    "osmnx>=2.0.0",
    "networkx>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.25.0,<0.26",
    "pytest-cov>=6.0,<7",
    "ruff>=0.11.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM"]
# FastAPI's Depends() in default args is the canonical pattern.
# Forward type refs in deps.py are intentional to avoid circular imports.
ignore = ["B008", "F821", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B015"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "ignore::RuntimeWarning:_pytest.logging",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/__init__.py", "*/test_*.py"]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
